name: 🤖 CI

on:
  push:
    branches-ignore:
      - "release-please--**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  format:
    name: 🔤 Oxfmt
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v6

      - name: ⎔ Setup node
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: ".nvmrc"

      - name: 📥 Install deps
        run: pnpm install

      - name: 💅 Format check
        run: pnpm run format:check

  lint:
    name: 🐂 Oxlint
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v6

      - name: ⎔ Setup node
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: ".nvmrc"

      - name: 📥 Install deps
        run: pnpm install

      - name: 🔬 Lint
        run: pnpm run lint

  typecheck:
    name: ʦ TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v6

      - name: ⎔ Setup node
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: ".nvmrc"

      - name: 📥 Install deps
        run: pnpm install

      - name: 🔎 Type check
        run: pnpm run typecheck

  test:
    name: 🩺 Remix tests
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v6

      - name: ⎔ Setup node
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: ".nvmrc"

      - name: 📥 Install deps
        run: pnpm install

      - name: 📥 Install Chromium
        run: pnpm exec playwright install chromium --only-shell --with-deps

      - name: 🩺 Remix tests
        run: pnpm test

  build:
    name: 👷‍♂️ Build
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v6

      - name: ⎔ Setup node
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: ".nvmrc"

      - name: 📥 Install deps
        run: pnpm install

      - name: 🛠 Build
        run: pnpm run build

  release:
    name: 🆕 Release
    runs-on: ubuntu-latest
    needs: [format, lint, typecheck, test, build]
    if: ${{ github.ref == 'refs/heads/main' }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: 🆕 Release Please
        id: release
        uses: googleapis/release-please-action@v5

  deploy-dev:
    name: 🚀 Deploy Dev
    runs-on: ubuntu-latest
    needs: [release]
    # deploy to dev on push to main, skip when release-please creates a release
    if: github.ref == 'refs/heads/main' && needs.release.outputs.release_created != 'true'
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: 👀 Read app name
        uses: SebRollen/toml-action@v1.2.0
        id: app_name
        with:
          file: fly.toml
          field: app

      - name: 🚀 Deploy
        uses: superfly/flyctl-actions@1.6
        with:
          args: deploy --remote-only --build-arg COMMIT_SHA=${{ github.sha }} --build-arg DEPLOYMENT_ENV=dev --app ${{ steps.app_name.outputs.value }}-dev
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-prod:
    name: 🚀 Deploy Production
    runs-on: ubuntu-latest
    needs: [release]
    if: ${{ needs.release.outputs.release_created == 'true' }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: 👀 Read app name
        uses: SebRollen/toml-action@v1.2.0
        id: app_name
        with:
          file: fly.toml
          field: app

      - name: 🚀 Deploy
        uses: superfly/flyctl-actions@1.6
        with:
          args: deploy --remote-only --build-arg COMMIT_SHA=${{ github.sha }} --build-arg DEPLOYMENT_ENV=prod --app ${{ steps.app_name.outputs.value }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: 🚫 Purge CDN Cache
        run: |
          curl -i -X POST https://api.fastly.com/service/${{ secrets.FASTLY_SERVICE_ID }}/purge \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "Fastly-Key: ${{ secrets.FASTLY_PURGE_API_KEY }}" \
            -H "Fastly-Soft-Purge: 1" \
            -H "Surrogate-Key: all"
